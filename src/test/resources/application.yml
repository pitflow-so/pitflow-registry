spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  liquibase:
    enabled: false

api:
  security:
    token:
      secret: test-secret-key-para-testes-apenas-nao-usar-em-producao-123456789
      expiration-hours: 3

management:
  datadog:
    metrics:
      export:
        enabled: false
