apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pitflow-registry
  namespace: pitflow
  labels:
    app.kubernetes.io/name: pitflow-registry
    app.kubernetes.io/instance: pitflow-registry
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: pitflow
    app.kubernetes.io/managed-by: github-actions
  annotations:
    alb.ingress.kubernetes.io/group.name: pitflow
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/healthcheck-path: /registry/actuator/health
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /registry
            pathType: Prefix
            backend:
              service:
                name: pitflow-registry
                port:
                  name: http
